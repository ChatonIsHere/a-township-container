services:
    a-township-container:
        build: .
        container_name: a-township-container
        restart: unless-stopped
        # Uncomment the following lines to limit CPU and memory usage
        # cpus: 2
        # mem_limit: 4g
        volumes:
            - ./game-source:/game-files
            - ./server-data:/root/.wine/drive_c/users/root/AppData/Roaming/A Township Tale
            - ./tavern-config:/root/.wine/drive_c/users/root/AppData/Roaming/TheModdingTavern
            - wine-prefix:/root/.wine
        ports:
            # gameserver
            - '${SERVER_PORT:-1757}:${SERVER_PORT:-1757}/udp'
            - '${SERVER_PORT:-1757}:${SERVER_PORT:-1757}/tcp'
            # rcon
            - '${RCON_PORT:-1760}:${RCON_PORT:-1760}/udp'
            - '${RCON_PORT:-1760}:${RCON_PORT:-1760}/tcp'
            # forest
            - '${FOREST_PORT:-1761}:${FOREST_PORT:-1761}/udp'
            - '${FOREST_PORT:-1761}:${FOREST_PORT:-1761}/tcp'
            # authentication
            - '${AUTH_PORT:-1762}:${AUTH_PORT:-1762}/udp'
            - '${AUTH_PORT:-1762}:${AUTH_PORT:-1762}/tcp'
        environment:
            SERVER_PORT: ${SERVER_PORT:-1757}
            AUTO_PATCH: ${AUTO_PATCH:-true}
            DEBUG: ${DEBUG:-false}
            ATT_ACCESS_TOKEN: ${ATT_ACCESS_TOKEN:-}
            ATT_REFRESH_TOKEN: ${ATT_REFRESH_TOKEN:-}
            ATT_IDENTITY_TOKEN: ${ATT_IDENTITY_TOKEN:-}

    # optional web admin panel, off by default. Start it with:
    #   docker compose --profile panel up -d
    # It needs PANEL_PASSWORD set in .env. Every change it makes goes through
    # tavern-config or the game's console port over this network; game-source is
    # only read for the log tail
    tavern-panel:
        build:
            context: .
            dockerfile: panel/Dockerfile
        # image: ghcr.io/chatonishere/a-township-container-panel:latest
        container_name: tavern-panel
        restart: unless-stopped
        profiles: [panel]
        depends_on:
            - a-township-container
        ports:
            - '${PANEL_PORT:-8080}:8080'
        volumes:
            - ./tavern-config:/data/tavern-config
            # read only, for tailing the MelonLoader log into the panel console
            - ./game-source:/game-files:ro
        environment:
            PANEL_PASSWORD: ${PANEL_PASSWORD:-}
            GAME_HOST: a-township-container
            RCON_PORT: ${RCON_PORT:-1760}

volumes:
    wine-prefix:
