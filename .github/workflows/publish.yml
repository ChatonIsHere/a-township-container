name: Publish Docker image

on:
    push:
        branches: [main]
        tags: ['*.*.*-*']
    workflow_dispatch:

env:
    IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                include:
                    # standalone image, tagged exactly as before so existing users are unaffected
                    - dockerfile: Dockerfile
                      suffix: ''
                    # Pterodactyl/Pelican/Calagopus image
                    - dockerfile: egg/Dockerfile
                      suffix: '-egg'
                    # CubeCoders AMP image
                    - dockerfile: amp/Dockerfile
                      suffix: '-amp'
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_NAME }}
                  # the suffix distinguishes the variants: latest / latest-egg / latest-amp (and the same for version tags)
                  flavor: |
                      suffix=${{ matrix.suffix }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=tag

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # each variant gets its own cache scope so the matrix legs don't overwrite each other
                  cache-from: type=gha,scope=build${{ matrix.suffix }}
                  cache-to: type=gha,mode=max,scope=build${{ matrix.suffix }}
