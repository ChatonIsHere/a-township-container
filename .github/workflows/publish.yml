name: Publish Docker image

on:
    push:
        branches: [main]
        tags: ['*.*.*-*']
    workflow_dispatch:

env:
    IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            # one variant failing shouldn't cancel the others' pushes
            fail-fast: false
            matrix:
                include:
                    - dockerfile: Dockerfile
                      suffix: ''
                    # Pterodactyl/Pelican/Calagopus image
                    - dockerfile: egg/Dockerfile
                      suffix: '-egg'
                    # CubeCoders AMP image
                    - dockerfile: amp/Dockerfile
                      suffix: '-amp'
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_NAME }}
                  # suffix per entry, not via flavor: flavor drops it from latest, so every variant
                  # pushed a bare :latest. latest checks the ref because {{is_default_branch}} is true
                  # on tag pushes. The branch entry is for workflow_dispatch off another branch
                  tags: |
                      type=raw,value=latest${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/main' }}
                      type=ref,event=tag,suffix=${{ matrix.suffix }}
                      type=ref,event=branch,suffix=${{ matrix.suffix }},enable=${{ github.ref != 'refs/heads/main' }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # per-variant scope so the legs don't overwrite each other's cache
                  cache-from: type=gha,scope=build${{ matrix.suffix }}
                  cache-to: type=gha,mode=max,scope=build${{ matrix.suffix }}
