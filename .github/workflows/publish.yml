name: Publish Docker image

on:
    push:
        branches: [main]
        tags: ['*.*.*-*']
    workflow_dispatch:

env:
    IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            # the variants are independent images, so one failing must not cancel the others midway -
            # with the default fail-fast a quick failure in the egg or amp leg takes the standalone
            # leg's :latest push down with it
            fail-fast: false
            matrix:
                include:
                    # standalone image, tagged exactly as before so existing users are unaffected
                    - dockerfile: Dockerfile
                      suffix: ''
                    # Pterodactyl/Pelican/Calagopus image
                    - dockerfile: egg/Dockerfile
                      suffix: '-egg'
                    # CubeCoders AMP image
                    - dockerfile: amp/Dockerfile
                      suffix: '-amp'
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract tags
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_NAME }}
                  # every tag is spelled out with the variant suffix baked into its value rather than
                  # applied through flavor: flavor's suffix is silently dropped from the latest tag, so
                  # the egg and amp legs each published a bare :latest and raced the standalone one for it
                  # (that's how :latest ended up being the egg image). {{is_default_branch}} also resolves
                  # true on tag pushes, which is what let the release candidates move :latest at all
                  tags: |
                      type=raw,value=latest${{ matrix.suffix }},enable=${{ github.ref == 'refs/heads/main' }}
                      type=raw,value=${{ github.ref_name }}${{ matrix.suffix }},enable=${{ github.ref != 'refs/heads/main' }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ${{ matrix.dockerfile }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # each variant gets its own cache scope so the matrix legs don't overwrite each other
                  cache-from: type=gha,scope=build${{ matrix.suffix }}
                  cache-to: type=gha,mode=max,scope=build${{ matrix.suffix }}
